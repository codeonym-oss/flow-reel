<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbit · Projects</title>
  <style>
    :root { --ink: #1b1f2a; --muted: #5d6475; --line: #e3e6ee; --accent: #3d5afe; --ok: #1e8e5a; --bg: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    aside { background: #fff; border-right: 1px solid var(--line); padding: 24px 16px; }
    aside h1 { font-size: 20px; margin: 0 0 24px 8px; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 8px 8px; }
    aside a { display: block; padding: 8px; border-radius: 8px; color: inherit; text-decoration: none; }
    aside a[aria-current] { background: #eef1ff; color: var(--accent); font-weight: 600; }
    #views:empty::after { content: "No saved views yet"; display: block; padding: 8px; color: var(--muted); font-size: 14px; }
    main { padding: 32px 48px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    header h2 { font-size: 28px; margin: 0; flex: 1; }
    button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .filters { display: flex; gap: 8px; margin-bottom: 24px; }
    .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    .pill { font-size: 13px; padding: 2px 10px; border-radius: 99px; background: #eef1ff; color: var(--accent); }
    .pill.done { background: #e6f6ee; color: var(--ok); }
    .chart { display: flex; align-items: flex-end; gap: 12px; height: 180px; padding-top: 12px; }
    .bar { flex: 1; background: var(--accent); border-radius: 6px 6px 0 0; position: relative; }
    .bar span { position: absolute; bottom: -24px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
    dialog { border: none; border-radius: 12px; padding: 24px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    dialog h3 { margin: 0 0 16px; }
    dialog label { display: block; margin-bottom: 16px; }
    dialog input { display: block; width: 100%; margin-top: 6px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
    #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; }
    #toast[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Orbit</h1>
      <a href="#" aria-current="page">Projects</a>
      <h2>Saved views</h2>
      <nav id="views" aria-label="Saved views"></nav>
    </aside>
    <main>
      <header>
        <h2>Projects</h2>
        <button class="primary" id="save-view">Save view</button>
      </header>
      <div class="filters" role="group" aria-label="Status">
        <button aria-pressed="true" data-status="all">All</button>
        <button aria-pressed="false" data-status="active">Active</button>
        <button aria-pressed="false" data-status="done">Done</button>
      </div>
      <div class="grid">
        <section class="card" aria-label="Project list">
          <table>
            <thead><tr><th>Project</th><th>Owner</th><th>Status</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <section class="card" aria-label="Tasks closed per week">
          <strong>Tasks closed per week</strong>
          <div class="chart" id="chart"></div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="form">
      <h3 id="dialog-title">Save this view</h3>
      <label>View name <input id="view-name" required autocomplete="off"></label>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button class="primary" value="save">Save</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>

  <script>
    // Fixed data, no network: the same page every time it loads.
    const projects = [
      { name: "Billing revamp", owner: "Ada", status: "active", weeks: [3, 5, 4, 7] },
      { name: "Mobile onboarding", owner: "Grace", status: "active", weeks: [2, 4, 6, 8] },
      { name: "Search ranking", owner: "Linus", status: "done", weeks: [6, 5, 3, 1] },
      { name: "Audit log", owner: "Margaret", status: "done", weeks: [4, 4, 2, 1] },
      { name: "Team invites", owner: "Alan", status: "active", weeks: [1, 3, 3, 5] },
    ];
    let status = "all";

    function render() {
      const shown = projects.filter((p) => status === "all" || p.status === status);
      document.getElementById("rows").innerHTML = shown.map((p) =>
        `<tr><td>${p.name}</td><td>${p.owner}</td><td><span class="pill ${p.status}">${p.status === "done" ? "Done" : "Active"}</span></td></tr>`).join("");
      const totals = [0, 1, 2, 3].map((w) => shown.reduce((sum, p) => sum + p.weeks[w], 0));
      const max = Math.max(...totals, 1);
      document.getElementById("chart").innerHTML = totals.map((t, w) =>
        `<div class="bar" style="height:${(t / max) * 100}%" aria-label="Week ${w + 1}: ${t} tasks"><span>W${w + 1}</span></div>`).join("");
    }

    document.querySelectorAll(".filters button").forEach((button) => button.addEventListener("click", () => {
      status = button.dataset.status;
      document.querySelectorAll(".filters button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      render();
    }));

    const dialog = document.getElementById("dialog");
    document.getElementById("save-view").addEventListener("click", () => {
      document.getElementById("view-name").value = "";
      dialog.showModal();
    });

    // Saving takes a moment, like a real request: the toast and the sidebar entry appear only once it's done.
    dialog.addEventListener("close", () => {
      if (dialog.returnValue !== "save") return;
      const name = document.getElementById("view-name").value.trim();
      const saved = status;
      setTimeout(() => {
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = name;
        // Opening a saved view brings its filter back.
        link.addEventListener("click", (e) => {
          e.preventDefault();
          document.querySelector(`.filters button[data-status="${saved}"]`).click();
          document.querySelectorAll("#views a").forEach((a) => a.toggleAttribute("aria-current", a === link));
        });
        document.getElementById("views").append(link);
        const toast = document.getElementById("toast");
        toast.textContent = `View "${name}" saved`;
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 4000);
      }, 600);
    });

    render();
  </script>
</body>
</html>
